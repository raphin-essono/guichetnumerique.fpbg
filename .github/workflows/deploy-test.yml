name: Déploiement sur serveur (branche test, sans Docker)

on:
  push:
    branches: [ "test" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Déployer via SSH sur le serveur
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "=== Connexion sur le serveur ==="
            cd ${{ secrets.SERVER_PATH }}

            echo "=== Récupération du code (branche test) ==="
            git fetch origin
            # si la branche test n'existe pas encore localement, on la crée
            git checkout test || git checkout -b test
            git pull origin test

            echo "=== Installation des dépendances ==="
            npm install --production

            echo "=== (Re)démarrage de l'app avec PM2 ==="
            pm2 restart guichet-fpbg || pm2 start server.js --name guichet-fpbg
            pm2 save
