name: Déploiement sur serveur (branche test, sans Docker)

on:
  push:
    branches:
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Déploiement via SSH sur le serveur
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}

          # --- Authentification par clé ---
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          # --- Commandes exécutées sur le serveur ---
          script: |
            set -e

            echo "=== Connexion sur le serveur ==="
            cd '${{ secrets.SERVER_PATH }}'

            echo "=== Récupération du code (branche test) ==="
            git fetch origin
            if git rev-parse --verify test >/dev/null 2>&1; then
              git checkout test
            else
              git checkout -b test origin/test
            fi
            git pull origin test

            echo "=== Installation des dépendances ==="
            npm install --production

            echo "=== (Re)démarrage de l'app avec PM2 ==="
            pm2 restart guichet-fpbg || pm2 start server.js --name guichet-fpbg
            pm2 save

            echo "=== ✅ Déploiement terminé avec succès ==="
