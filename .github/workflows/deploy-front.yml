name: Build front sur serveur (branche test-front)

on:
  push:
    branches:
      - test-front
  workflow_dispatch:

jobs:
  build-front:
    runs-on: ubuntu-latest

    steps:
      - name: Build front via SSH sur le serveur
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            echo "=== Connexion sur le serveur ==="

            BASE_DIR="${{ secrets.SERVER_PATH_PRONT }}"
            echo "Chemin front : '$BASE_DIR'"

            mkdir -p "$BASE_DIR"
            cd "$BASE_DIR"

            git config --global credential.helper ""

            # --- CAS 1 : pas encore de dépôt, on clone directement la branche test-front ---
            if [ ! -d .git ]; then
              echo "=== Aucun dépôt Git trouvé, clonage initial sur test-front ==="
              git clone --depth=1 --branch test-front "${{ secrets.GIT_REPO_URL }}" .
            else
              echo "=== Dépôt déjà présent, mise à jour ==="
              git remote set-url origin "${{ secrets.GIT_REPO_URL }}"
              git fetch origin --prune

              echo "=== Vérification de origin/test-front ==="
              if git show-ref --verify --quiet refs/remotes/origin/test-front; then
                echo "origin/test-front trouvé, checkout forcé"
                # crée / écrase la branche locale test-front à partir de origin/test-front
                git checkout -B test-front origin/test-front
              else
                echo "origin/test-front introuvable, reclonage complet..."
                cd ..
                rm -rf "$BASE_DIR"
                mkdir -p "$BASE_DIR"
                cd "$BASE_DIR"
                git clone --depth=1 --branch test-front "${{ secrets.GIT_REPO_URL }}" .
              fi
            fi

            echo "=== Dernier commit sur test-front ==="
            git log -1 --oneline || true

            echo "=== Vérification / installation de Node.js & npm ==="
            if ! command -v node >/dev/null 2>&1; then
              echo "Node.js non trouvé, installation..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            echo "Node version : $(node -v)"
            echo "NPM version : $(npm -v)"

            echo "=== Installation des dépendances (front) ==="
            npm install

            echo "=== Build front (npm run build) ==="
            npm run build

            echo "=== Vérification du dossier dist ==="
            if [ -d dist ]; then
              echo "Build réussi : le dossier dist existe."
            else
              echo "Build échoué : le dossier dist est introuvable."
              exit 1
            fi

            echo "=== Pipeline terminé avec succès (CI front OK) ==="
